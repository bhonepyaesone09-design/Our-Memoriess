<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Memories</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fdf5f7;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
        }

        /* Side photos */
        .side-photo {
            width: 220px;
            height: 300px;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        /* Main webpage */
        .main {
            flex: 1;
            text-align: center;
        }

        .main h1 {
            font-size: 45px;
            color: #d45d79;
            margin-bottom: 40px;
        }

        .link {
            display: block;
            margin: 20px auto;
            padding: 18px 30px;
            max-width: 350px;
            text-decoration: none;
            color: white;
            background-color: #d45d79;
            border-radius: 15px;
            font-size: 22px;
            transition: 0.3s;
        }

        .link:hover {
            background-color: #b94763;
            transform: scale(1.05);
        }

        /* For phones */
        @media (max-width: 800px) {
            .container {
                flex-direction: column;
            }

            .side-photo {
                width: 180px;
                height: 220px;
            }

            .main h1 {
                font-size: 35px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Left photo -->
        <img src="photo_2026-08-08_16-32-41.jpg" alt="Our Photo" class="side-photo">

        <!-- Main content -->
        <div class="main">

            <h1>Our Memories ❤️</h1>

            <!-- Opens Letter.html in a new tab -->
            <a href="Letter.html" target="_blank" class="link">
                💌 Letter
            </a>

            <!-- Opens Memo.html in a new tab -->
            <a href="Our memo.html" target="_blank" class="link">
                📖 Our memo in one month
            </a>

        </div>

        
        <img src="photo_2026-08-08_16-32-47.jpg" alt="Our Photo" class="side-photo">

    </div>

</body>
</html>
